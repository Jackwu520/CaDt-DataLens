<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaDt V3 Spike</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #1e1f24;
      color: #d7dae0;
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2c2e36;
      -webkit-app-region: drag;
      user-select: none;
    }
    header b { font-size: 14px; }
    header .win { color: #7f8794; }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: #2ea043; }
    #hint { padding: 8px 14px; color: #7f8794; }
    #log {
      flex: 1;
      margin: 0;
      padding: 10px 14px 16px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font: 12px/1.55 "JetBrains Mono", Consolas, monospace;
      color: #a9b1bd;
    }
    button {
      -webkit-app-region: no-drag;
      background: #2a2d35;
      color: #d7dae0;
      border: 1px solid #3a3f4b;
      border-radius: 6px;
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #343842; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <b>CaDt Wails v3 P0 Spike</b>
    <span class="win" id="win"></span>
    <span class="spacer"></span>
    <button id="btn-float">打开/聚焦浮窗</button>
    <button id="btn-ping">发射定向事件</button>
    <button id="btn-exec">ExecJS 探针</button>
  </header>
  <div id="hint">程序化验证结果同时写入 %TEMP%\cadt-v3-spike.log；窗口拖动由 header 的 app-region 提供。</div>
  <pre id="log"></pre>
  <script type="module" src="/spike.js"></script>
</body>
</html>
